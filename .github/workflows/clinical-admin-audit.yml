name: Clinical and Admin audit fixes

on:
  push:
    branches: [clinical-admin-audit-2026-08-30]

permissions:
  contents: write

jobs:
  patch-build-validate:
    if: github.event.head_commit.message == 'Run clinical and Admin audit fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: clinical-admin-audit-2026-08-30
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply audited fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f"Missing patch anchor: {label}")
              return text.replace(old, new, 1)

          # Shared released-medication defaults in field app.
          p=Path('src/App.tsx')
          t=p.read_text(encoding='utf-8')
          import_anchor='import {mergeMedicationCatalog,medicationCatalogRetired,medicationCatalogVisible} from "./medicationCatalogStore";\n'
          import_line='import {DEFAULT_FIELD_MEDICATION_IDS} from "./medicationReleaseConfig";\n'
          if import_line not in t:
              t=replace_once(t, import_anchor, import_anchor+import_line, 'App shared medication config import')
          old='const DEFAULT_TESTING_VISIBLE_MEDICATION_IDS=["adenosine","amiodarone","ondansetron","haloperidol","atropine","midazolam","fentanyl","calcium","dextrose","diphenhydramine","epinephrine","magnesium","methylprednisolone","naloxone","sodium-bicarbonate","ketamine"];'
          new='const DEFAULT_TESTING_VISIBLE_MEDICATION_IDS=[...DEFAULT_FIELD_MEDICATION_IDS];'
          t=replace_once(t,old,new,'App default medication list')
          p.write_text(t,encoding='utf-8')

          # Generic calculator: enforce age bounds and standalone Haloperidol parity.
          p=Path('src/DmpMedicationCalculator.tsx')
          t=p.read_text(encoding='utf-8')
          old='ageChangesDose=!!path&&(path.formula.kind==="ageBands"||["antipsychotics","diazepam","lorazepam","diltiazem"].includes(medication.id))'
          new='ageChangesDose=!!path&&(path.formula.kind==="ageBands"||path.minAge!==undefined||path.maxAge!==undefined||["antipsychotics","haloperidol","diazepam","lorazepam","diltiazem"].includes(medication.id))'
          t=replace_once(t,old,new,'generic age-gating')
          old='if(medicationId==="diltiazem"&&age>65){dose*=.5;dose=Math.min(dose,10)}if(medicationId==="antipsychotics"&&age>=65)dose*=.5;'
          new='if(medicationId==="diltiazem"&&age>65){dose*=.5;dose=Math.min(dose,10)}if((medicationId==="antipsychotics"||medicationId==="haloperidol")&&age>=65)dose*=.5;'
          t=replace_once(t,old,new,'Haloperidol elderly dose adjustment')
          old='if(id==="antipsychotics"||id==="diazepam"||id==="lorazepam")return[first,"Continuous ECG, SpO₂ and ventilation monitoring; waveform capnography when available.","Reassess sedation score, airway, respiratory rate and blood pressure before any additional dose."];'
          new='if(id==="antipsychotics"||id==="haloperidol"||id==="diazepam"||id==="lorazepam")return[first,"Continuous ECG, SpO₂ and ventilation monitoring; waveform capnography when available.","Reassess sedation score, airway, respiratory rate and blood pressure before any additional dose."];'
          t=replace_once(t,old,new,'Haloperidol monitoring')
          p.write_text(t,encoding='utf-8')

          # Medication data naming and standalone Ondansetron clinical caution.
          p=Path('src/dmpMedicationData.ts')
          t=p.read_text(encoding='utf-8')
          t=t.replace('atropine:{id:"atropine",name:"Atropine",protocolId:"9060"','atropine:{id:"atropine",name:"Atropine Sulfate",protocolId:"9060"',1)
          old='contraindications: id==="ondansetron" ? ["Confirm ondansetron-specific age and contraindications in current DMP 9040 Antiemetics protocol"] : alias.contraindications,'
          new='contraindications: id==="ondansetron" ? ["First-trimester pregnancy unless severe dehydration and intractable vomiting make Ondansetron necessary"] : alias.contraindications,'
          t=replace_once(t,old,new,'Ondansetron caution')
          p.write_text(t,encoding='utf-8')

          # Admin: shared visibility, better clinical defaults, validation, concentration math, readable review.
          p=Path('src/AdminMedicationManager.tsx')
          t=p.read_text(encoding='utf-8')
          import_anchor='import "./adminMedicationManager.css";\n'
          import_line='import {CURRENT_DMP_PROTOCOL_REVISION,DEFAULT_FIELD_MEDICATION_IDS} from "./medicationReleaseConfig";\n'
          if import_line not in t:
              t=replace_once(t,import_anchor,import_line+import_anchor,'Admin shared config import')
          t=replace_once(t,'const DEFAULT_VISIBLE_IDS=["midazolam","fentanyl","ketamine"];','const DEFAULT_VISIBLE_IDS=[...DEFAULT_FIELD_MEDICATION_IDS];','Admin default visible list')
          t=t.replace('doseRules:{adult:"1 mcg/kg typical starting calculation; adult doses may be rounded to nearest 25 mcg"','doseRules:{adult:"1–2 mcg/kg; typical adult initial dose 100 mcg and doses may be rounded to nearest 25 mcg"',1)
          t=t.replace('adenosine:{id:"adenosine",name:"Adenosine",protocolId:"9010",page:123,category:"Antiarrhythmic",indications:["Regular narrow-complex AV nodal reentrant tachycardia"],routes:["IV"],doseRules:{adultInitial:"12 mg rapid IV",adultRepeat:"One additional 12 mg rapid IV dose",pediatricInitial:"0.1 mg/kg; max 6 mg; direct Base order",pediatricRepeat:"0.2 mg/kg; max 12 mg; direct Base order"},administration:["Rapid IV bolus followed immediately by normal saline flush","Continuous ECG monitoring"]},',
          'adenosine:{id:"adenosine",name:"Adenosine",protocolId:"9010",page:123,category:"Antiarrhythmic",indications:["Regular narrow-complex AV nodal reentrant tachycardia"],routes:["IV"],doseRules:{adultInitial:"12 mg rapid IV",adultRepeat:"One additional 12 mg rapid IV dose",pediatricInitial:"0.1 mg/kg; max 6 mg; direct Base order",pediatricRepeat:"0.2 mg/kg; max 12 mg; direct Base order"},contraindications:["Irregular tachycardia","Heart transplant history"],monitoring:["Continuous ECG monitoring","Warn patient about brief unpleasant chest discomfort","Asthma/bronchospasm precaution reviewed"],administration:["Rapid IV bolus followed immediately by normal saline flush"]},',1)
          t=t.replace('diphenhydramine:{id:"diphenhydramine",name:"Diphenhydramine",protocolId:"9100",page:144,category:"Antihistamine",indications:["Allergic reaction","Dystonic medication reaction or akathisia"],routes:["IV/IO","IM"],doseRules:{adult:"50 mg",adultOver65:"25 mg",pediatric:"1 mg/kg; max 50 mg"},administration:["Slow IV/IO/IM","For mild reactions consider PO per protocol"]},',
          'diphenhydramine:{id:"diphenhydramine",name:"Diphenhydramine",protocolId:"9100",page:144,category:"Antihistamine",indications:["Allergic reaction","Dystonic medication reaction or akathisia"],routes:["IV/IO","IM"],doseRules:{adult:"50 mg",adultOver65:"25 mg",pediatric:"1 mg/kg; max 50 mg"},contraindications:["Use caution in asthma/COPD because secretions may thicken","Narrow-angle glaucoma precaution","Patients over 65 receive the reduced 25 mg dose"],monitoring:["Monitor mental status, airway and respiratory status","Watch for drowsiness and additive CNS-depressant effects"],administration:["Slow IV/IO/IM","For mild reactions consider PO per protocol"]},',1)
          t=t.replace('methylprednisolone:{id:"methylprednisolone",name:"Methylprednisolone",protocolId:"9200",page:158,category:"Corticosteroid",indications:["Allergic reaction / anaphylaxis","Severe asthma or COPD","Suspected Addisonian crisis"],routes:["IV/IO"],doseRules:{adult:"125 mg",pediatric:"2 mg/kg; max 125 mg"},administration:["Slow IV/IO bolus over 2 minutes","Reconstitute and use immediately"]},',
          'methylprednisolone:{id:"methylprednisolone",name:"Methylprednisolone",protocolId:"9200",page:158,category:"Corticosteroid",indications:["Allergic reaction / anaphylaxis","Severe asthma or COPD","Suspected Addisonian crisis"],routes:["IV/IO"],doseRules:{adult:"125 mg",pediatric:"2 mg/kg; max 125 mg"},contraindications:["Active gastrointestinal bleeding precaution"],monitoring:["Delayed onset: do not delay transport or primary airway/ventilation treatment"],administration:["Slow IV/IO bolus over 2 minutes","Reconstitute and use immediately"]},',1)
          t=t.replace('epinephrine:{id:"epinephrine",name:"Epinephrine",protocolId:"9120",page:148,category:"Adrenergic agonist",indications:["Pulseless arrest","Systemic allergic reaction — IM","Wheezing — IM","Hypotension or refractory anaphylaxis — push dose","Hypotension or refractory anaphylaxis — infusion","Pediatric severe anaphylaxis — Base push dose","Bradycardia with poor perfusion","Stridor at rest — alternative to racemic epinephrine","Systemic allergic reaction — auto-injector"],routes:["IV/IO","IM","Nebulized"],concentrations:[{label:"1:10,000",concentration:0.1,concentrationUnit:"mg/mL"},{label:"1:1,000",concentration:1,concentrationUnit:"mg/mL"}],administration:["Calculator enforces indication-specific concentration and route matching"]}',
          'epinephrine:{id:"epinephrine",name:"Epinephrine",protocolId:"9120",page:148,category:"Adrenergic agonist",indications:["Pulseless arrest","Systemic allergic reaction — IM","Wheezing — IM","Hypotension or refractory anaphylaxis — push dose","Hypotension or refractory anaphylaxis — infusion","Pediatric severe anaphylaxis — Base push dose","Bradycardia with poor perfusion","Stridor at rest — alternative to racemic epinephrine","Systemic allergic reaction — auto-injector"],routes:["IV/IO","IM","Nebulized"],concentrations:[{label:"1:10,000",concentration:0.1,concentrationUnit:"mg/mL"},{label:"1:1,000",concentration:1,concentrationUnit:"mg/mL"}],administration:["Calculator enforces indication-specific concentration and route matching"],notes:["Adult push-dose Epinephrine preparation is agency-specific in DMP 9120. Confirm the department-approved mixing guidance before review approval."]}',1)
          t=t.replace('setProtocolRevision(record?.protocolRevision||"July 2026")','setProtocolRevision(record?.protocolRevision||CURRENT_DMP_PROTOCOL_REVISION)',1)
          t=t.replace('setProtocolRevision("July 2026")','setProtocolRevision(CURRENT_DMP_PROTOCOL_REVISION)',1)
          t=t.replace('record?.protocolRevision||"July 2026"','record?.protocolRevision||CURRENT_DMP_PROTOCOL_REVISION',1)

          old_validate='''  const validateClinical=(data:JsonObject)=>{\n    if(!String(data.name||"").trim())throw new Error("Medication name is required.");\n    if(Array.isArray(data.paths)){\n      const ids=new Set<string>();\n      for(const raw of data.paths as DosePath[]){\n        if(!raw.id?.trim())throw new Error("Every treatment path needs an ID.");\n        if(ids.has(raw.id))throw new Error(`Duplicate treatment path ID: ${raw.id}`);ids.add(raw.id);\n        if(!raw.route?.trim())throw new Error(`Route is required for ${raw.label||raw.id}.`);\n        const f=raw.formula||{};\n        const numeric=[f.amount,f.min,f.max].filter(v=>v!==undefined);\n        if(numeric.some(v=>!Number.isFinite(v)||Number(v)<0))throw new Error(`Dose values cannot be negative for ${raw.label||raw.id}.`);\n        if(f.kind==="range"&&f.min!==undefined&&f.max!==undefined&&f.min>f.max)throw new Error(`Minimum dose cannot exceed maximum dose for ${raw.label||raw.id}.`);\n        if(f.kind==="perKg"&&f.amount===undefined)throw new Error(`Per-kg amount is required for ${raw.label||raw.id}.`);\n      }\n    }\n  };'''
          new_validate='''  const normalizeClinical=(data:JsonObject)=>{\n    const next=deepClone(data) as JsonObject;\n    const trimList=(value:any)=>Array.isArray(value)?value.map(item=>typeof item==="string"?item.trim():item).filter(item=>typeof item!=="string"||item.length>0):value;\n    for(const key of ["indications","routes","contraindications","monitoring","administration","notes"])if(key in next)next[key]=trimList(next[key]);\n    if(Array.isArray(next.concentrations))next.concentrations=next.concentrations.map((raw:Concentration)=>{\n      const item={...raw,label:String(raw.label||"").trim(),amountUnit:String(raw.amountUnit||"").trim(),volumeUnit:String(raw.volumeUnit||"mL").trim(),concentrationUnit:String(raw.concentrationUnit||"").trim()};\n      if(Number.isFinite(item.amount)&&Number(item.amount)>0&&Number.isFinite(item.volume)&&Number(item.volume)>0)item.concentration=Number(item.amount)/Number(item.volume);\n      return item;\n    });\n    if(Array.isArray(next.paths))next.paths=next.paths.map((raw:DosePath)=>({...raw,id:String(raw.id||"").trim(),label:String(raw.label||"").trim(),agent:String(raw.agent||"").trim(),route:String(raw.route||"").trim(),protocol:String(raw.protocol||"").trim(),repeat:String(raw.repeat||"").trim(),administration:String(raw.administration||"").trim(),baseContact:typeof raw.baseContact==="string"?raw.baseContact.trim():raw.baseContact,monitoring:trimList(raw.monitoring),special:trimList(raw.special)}));\n    return next;\n  };\n  const validateClinical=(data:JsonObject)=>{\n    if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("Medication clinical data must be a valid record.");\n    if(!String(data.name||"").trim())throw new Error("Medication name is required.");\n    if(!String(data.protocolId||"").trim())throw new Error("Protocol / medication ID is required.");\n    if(Array.isArray(data.concentrations)){\n      for(const [index,raw] of (data.concentrations as Concentration[]).entries()){\n        const label=raw.label?.trim()||`Concentration ${index+1}`;\n        const hasAmount=raw.amount!==undefined,hasVolume=raw.volume!==undefined,hasConcentration=raw.concentration!==undefined;\n        if(hasAmount!==hasVolume)throw new Error(`${label}: enter both medication amount and vial volume, or leave both blank.`);\n        if(hasAmount&&(!(Number(raw.amount)>0)||!(Number(raw.volume)>0)))throw new Error(`${label}: medication amount and vial volume must be greater than zero.`);\n        if(hasConcentration&&(!(Number(raw.concentration)>0)||!Number.isFinite(Number(raw.concentration))))throw new Error(`${label}: concentration must be greater than zero.`);\n        if(hasAmount&&hasVolume){\n          if(!raw.amountUnit?.trim())throw new Error(`${label}: amount unit is required.`);\n          if(!raw.concentrationUnit?.trim())throw new Error(`${label}: concentration unit is required.`);\n          const calculated=Number(raw.amount)/Number(raw.volume);\n          if(hasConcentration&&Math.abs(Number(raw.concentration)-calculated)>Math.max(.0001,calculated*.001))throw new Error(`${label}: concentration does not match amount ÷ volume.`);\n        }else if(!hasConcentration)throw new Error(`${label}: enter amount + volume or a direct concentration.`);\n      }\n    }\n    if(Array.isArray(data.paths)){\n      const ids=new Set<string>();\n      for(const raw of data.paths as DosePath[]){\n        const label=raw.label?.trim()||raw.id||"Treatment path";\n        if(!raw.id?.trim())throw new Error("Every treatment path needs an ID.");\n        if(ids.has(raw.id))throw new Error(`Duplicate treatment path ID: ${raw.id}`);ids.add(raw.id);\n        if(!raw.label?.trim())throw new Error(`${raw.id}: indication / label is required.`);\n        if(!raw.agent?.trim())throw new Error(`${label}: medication / agent is required.`);\n        if(!patientGroups.includes(raw.patient))throw new Error(`${label}: select a valid patient group.`);\n        if(!raw.route?.trim())throw new Error(`Route is required for ${label}.`);\n        if(raw.minAge!==undefined&&(!Number.isFinite(raw.minAge)||raw.minAge<0))throw new Error(`${label}: minimum age must be zero or greater.`);\n        if(raw.maxAge!==undefined&&(!Number.isFinite(raw.maxAge)||raw.maxAge<=0))throw new Error(`${label}: maximum age must be greater than zero.`);\n        if(raw.minAge!==undefined&&raw.maxAge!==undefined&&raw.minAge>=raw.maxAge)throw new Error(`${label}: minimum age must be below maximum age.`);\n        for(const [key,value] of [["Repeat interval",raw.repeatAfterMinutes],["Maximum administrations",raw.maxAdministrations],["Maximum cumulative dose",raw.maxCumulative],["Maximum cumulative per kg",raw.maxCumulativePerKg],["Absolute cumulative maximum",raw.absoluteCumulativeMax]] as const)if(value!==undefined&&(!Number.isFinite(value)||Number(value)<=0))throw new Error(`${label}: ${key} must be greater than zero.`);\n        if(raw.maxAdministrations!==undefined&&!Number.isInteger(raw.maxAdministrations))throw new Error(`${label}: maximum administrations must be a whole number.`);\n        if(raw.suggestedConcentration!==undefined&&(!Number.isFinite(raw.suggestedConcentration)||raw.suggestedConcentration<=0))throw new Error(`${label}: suggested concentration must be greater than zero.`);\n        const f=raw.formula||{};\n        if(!formulaKinds.includes(f.kind))throw new Error(`${label}: select a valid dose formula type.`);\n        if(!f.unit?.trim())throw new Error(`${label}: dose unit is required.`);\n        if((f.kind==="fixed"||f.kind==="perKg")&&(!(Number(f.amount)>0)||!Number.isFinite(Number(f.amount))))throw new Error(`${label}: dose amount must be greater than zero.`);\n        if(f.kind==="range"&&(!(Number(f.min)>0)||!(Number(f.max)>0)||!Number.isFinite(Number(f.min))||!Number.isFinite(Number(f.max))))throw new Error(`${label}: range minimum and maximum must be greater than zero.`);\n        if(f.kind==="range"&&Number(f.min)>Number(f.max))throw new Error(`${label}: minimum dose cannot exceed maximum dose.`);\n        if(f.kind==="instruction"&&!String(f.text||"").trim())throw new Error(`${label}: dose instruction is required.`);\n        if(f.kind==="ageBands"){\n          if(!Array.isArray(f.bands)||f.bands.length===0)throw new Error(`${label}: add at least one age band.`);\n          const bands=[...f.bands].sort((a,b)=>a.min-b.min);\n          bands.forEach((band,index)=>{if(!Number.isFinite(band.min)||!Number.isFinite(band.max)||band.min<0||band.min>=band.max||!Number.isFinite(band.amount)||band.amount<=0)throw new Error(`${label}: every age band needs a valid age range and dose greater than zero.`);if(index>0&&band.min<bands[index-1].max)throw new Error(`${label}: age bands cannot overlap.`)});\n        }\n      }\n    }\n  };'''
          t=replace_once(t,old_validate,new_validate,'Admin clinical validation')
          t=t.replace('const nextData={...editorData,id:selected.id,name:editorCatalog.name,protocolId:editorCatalog.protocol.id,page:editorCatalog.protocol.page};\n      validateClinical(nextData);','const nextData=normalizeClinical({...editorData,id:selected.id,name:editorCatalog.name.trim(),protocolId:editorCatalog.protocol.id.trim(),page:editorCatalog.protocol.page});\n      validateClinical(nextData);',1)

          old_conc='''function ConcentrationEditor({values,onChange}:{values:Concentration[];onChange:(v:Concentration[])=>void}){\n  const update=(index:number,key:string,value:any)=>onChange(values.map((item,i)=>i===index?{...item,[key]:value}:item));\n  return <div className="admin-stack-editor">{values.map((item,index)=><article className="admin-concentration-card" key={index}><div className="admin-form-grid compact"><Field label="Display label"><input value={item.label||""} onChange={e=>update(index,"label",e.target.value)}/></Field><Field label="Medication amount"><input type="number" step="any" value={item.amount??""} onChange={e=>update(index,"amount",num(e.target.value))}/></Field><Field label="Amount unit"><input value={item.amountUnit||""} onChange={e=>update(index,"amountUnit",e.target.value)}/></Field><Field label="Vial volume (mL)"><input type="number" step="any" value={item.volume??""} onChange={e=>update(index,"volume",num(e.target.value))}/></Field><Field label="Calculated concentration"><input type="number" step="any" value={item.concentration??""} onChange={e=>update(index,"concentration",num(e.target.value))}/></Field><Field label="Concentration unit"><input value={item.concentrationUnit||""} onChange={e=>update(index,"concentrationUnit",e.target.value)}/></Field></div><button className="danger text-button" onClick={()=>onChange(values.filter((_,i)=>i!==index))}>Remove concentration</button></article>)}<button className="admin-add-row" onClick={()=>onChange([...values,{label:"",amount:undefined,amountUnit:"mg",volume:undefined,volumeUnit:"mL",concentration:undefined,concentrationUnit:"mg/mL"}])}>+ Add concentration</button></div>;\n}'''
          new_conc='''function ConcentrationEditor({values,onChange}:{values:Concentration[];onChange:(v:Concentration[])=>void}){\n  const update=(index:number,key:string,value:any)=>onChange(values.map((item,i)=>{if(i!==index)return item;const next={...item,[key]:value};if((key==="amount"||key==="volume")&&Number(next.amount)>0&&Number(next.volume)>0)next.concentration=Number(next.amount)/Number(next.volume);return next}));\n  return <div className="admin-stack-editor">{values.map((item,index)=>{const calculated=Number(item.amount)>0&&Number(item.volume)>0?Number(item.amount)/Number(item.volume):null;return <article className="admin-concentration-card" key={index}><div className="admin-form-grid compact"><Field label="Display label"><input value={item.label||""} onChange={e=>update(index,"label",e.target.value)}/></Field><Field label="Medication amount"><input type="number" min="0" step="any" value={item.amount??""} onChange={e=>update(index,"amount",num(e.target.value))}/></Field><Field label="Amount unit"><input value={item.amountUnit||""} onChange={e=>update(index,"amountUnit",e.target.value)}/></Field><Field label="Vial volume (mL)"><input type="number" min="0" step="any" value={item.volume??""} onChange={e=>update(index,"volume",num(e.target.value))}/></Field>{calculated!==null?<Field label="Calculated concentration"><output>{Number(calculated.toFixed(6))} {item.concentrationUnit||"per mL"}</output></Field>:<Field label="Direct concentration"><input type="number" min="0" step="any" value={item.concentration??""} onChange={e=>update(index,"concentration",num(e.target.value))}/></Field>}<Field label="Concentration unit"><input value={item.concentrationUnit||""} onChange={e=>update(index,"concentrationUnit",e.target.value)}/></Field></div><small>When amount and volume are entered, concentration is calculated automatically and cannot drift from the vial math.</small><button className="danger text-button" onClick={()=>onChange(values.filter((_,i)=>i!==index))}>Remove concentration</button></article>})}<button className="admin-add-row" onClick={()=>onChange([...values,{label:"",amount:undefined,amountUnit:"mg",volume:undefined,volumeUnit:"mL",concentration:undefined,concentrationUnit:"mg/mL"}])}>+ Add concentration</button></div>;\n}'''
          t=replace_once(t,old_conc,new_conc,'Admin concentration editor')

          old_record='''function ClinicalRecord({data}:{data:JsonObject}){\n  const entries=Object.entries(data).filter(([key])=>!key.startsWith("_"));\n  return <section className="admin-clinical-record"><div className="admin-clinical-intro"><small>COMPLETE MEDICATION RECORD</small><b>Review every section against the current protocol.</b><span>Select “Edit medication fields” to make changes using the structured editor.</span></div>{entries.map(([key,value])=><article key={key}><h3>{key.replace(/([A-Z])/g," $1").replace(/^./,letter=>letter.toUpperCase())}</h3>{Array.isArray(value)?<div className="admin-value-list">{value.map((item,index)=><div key={index}>{typeof item==="object"&&item!==null?<pre>{JSON.stringify(item,null,2)}</pre>:<span>{String(item)}</span>}</div>)}</div>:typeof value==="object"&&value!==null?<pre>{JSON.stringify(value,null,2)}</pre>:<p>{String(value??"—")}</p>}</article>)}</section>;\n}'''
          new_record='''function formulaSummary(formula:DoseFormula|undefined){if(!formula)return"Not configured";if(formula.kind==="fixed")return`${formula.amount??"—"} ${formula.unit||""}`;if(formula.kind==="perKg")return`${formula.amount??"—"} ${formula.unit||""}/kg${formula.min!==undefined?` • min ${formula.min}`:""}${formula.max!==undefined?` • max ${formula.max}`:""}`;if(formula.kind==="range")return`${formula.min??"—"}–${formula.max??"—"} ${formula.unit||""}`;if(formula.kind==="instruction")return formula.text||"Instruction not entered";if(formula.kind==="ageBands")return`${formula.bands?.length||0} age band${formula.bands?.length===1?"":"s"}`;return formula.kind}\nfunction ClinicalRecord({data}:{data:JsonObject}){\n  const hidden=new Set(["id"]),entries=Object.entries(data).filter(([key])=>!key.startsWith("_")&&!hidden.has(key));\n  return <section className="admin-clinical-record"><div className="admin-clinical-intro"><small>COMPLETE MEDICATION RECORD</small><b>Review every section against the current protocol.</b><span>Select “Edit medication fields” to make changes. The review screen intentionally avoids raw JSON/code.</span></div>{entries.map(([key,value])=>{const title=key.replace(/([A-Z])/g," $1").replace(/^./,letter=>letter.toUpperCase());if(key==="paths"&&Array.isArray(value))return <article key={key}><h3>Indications, routes & doses</h3><div className="admin-path-list">{(value as DosePath[]).map((path,index)=><section className="admin-path-card" key={path.id||index}><header><div><small>{path.patient?.toUpperCase()||"ALL"} • {path.route||"Route not set"}</small><b>{path.label||"Untitled pathway"}</b></div></header><div className="admin-form-grid compact"><p><small>Medication / agent</small><b>{path.agent||"—"}</b></p><p><small>Dose</small><b>{formulaSummary(path.formula)}</b></p><p><small>Age range</small><b>{path.minAge!==undefined||path.maxAge!==undefined?`${path.minAge??0} to ${path.maxAge??"no maximum"} years`:"No age boundary"}</b></p><p><small>Repeat</small><b>{path.repeat||"No repeat instruction"}</b></p><p><small>Administration</small><b>{path.administration||"—"}</b></p><p><small>Protocol source</small><b>{path.protocol||"—"}</b></p>{path.baseContact&&<p><small>Base contact</small><b>{path.baseContact}</b></p>}{path.suggestedConcentration&&<p><small>Suggested concentration</small><b>{path.suggestedConcentration} {path.concentrationUnit||""}</b></p>}</div>{Array.isArray(path.monitoring)&&path.monitoring.length>0&&<><h4>Monitoring</h4><ul>{path.monitoring.map((item:string)=><li key={item}>{item}</li>)}</ul></>}{Array.isArray(path.special)&&path.special.length>0&&<><h4>Special considerations</h4><ul>{path.special.map((item:string)=><li key={item}>{item}</li>)}</ul></>}</section>)}</div></article>;if(key==="concentrations"&&Array.isArray(value))return <article key={key}><h3>Concentrations</h3><div className="admin-value-list">{(value as Concentration[]).map((item,index)=><div key={index}><b>{item.label||`Concentration ${index+1}`}</b><span>{item.amount&&item.volume?`${item.amount} ${item.amountUnit||""} / ${item.volume} ${item.volumeUnit||"mL"} = ${item.concentration??Number(item.amount)/Number(item.volume)} ${item.concentrationUnit||""}`:`${item.concentration??"—"} ${item.concentrationUnit||""}`}</span></div>)}</div></article>;if(Array.isArray(value))return <article key={key}><h3>{title}</h3><div className="admin-value-list">{value.length?value.map((item,index)=><div key={index}><span>{String(item)}</span></div>):<p>None listed</p>}</div></article>;if(value&&typeof value==="object")return <article key={key}><h3>{title}</h3><div className="admin-value-list">{Object.entries(value).map(([child,childValue])=><div key={child}><b>{child.replace(/([A-Z])/g," $1")}</b><span>{String(childValue??"—")}</span></div>)}</div></article>;return <article key={key}><h3>{title}</h3><p>{String(value??"—")}</p></article>})}</section>;\n}'''
          t=replace_once(t,old_record,new_record,'Admin readable clinical record')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Static audit assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('src/App.tsx').read_text()
          admin=Path('src/AdminMedicationManager.tsx').read_text()
          calc=Path('src/DmpMedicationCalculator.tsx').read_text()
          data=Path('src/dmpMedicationData.ts').read_text()
          required=["adenosine","amiodarone","ondansetron","haloperidol","atropine","midazolam","fentanyl","calcium","dextrose","diphenhydramine","epinephrine","magnesium","methylprednisolone","naloxone","sodium-bicarbonate","ketamine"]
          config=Path('src/medicationReleaseConfig.ts').read_text()
          missing=[x for x in required if f'"{x}"' not in config]
          if missing: raise SystemExit(f'Missing released medication IDs: {missing}')
          assert 'DEFAULT_FIELD_MEDICATION_IDS' in app and 'DEFAULT_FIELD_MEDICATION_IDS' in admin
          assert 'const DEFAULT_VISIBLE_IDS=["midazolam","fentanyl","ketamine"]' not in admin
          assert 'path.minAge!==undefined||path.maxAge!==undefined' in calc
          assert 'medicationId==="haloperidol"' in calc
          assert 'id==="haloperidol"' in calc
          assert 'Confirm ondansetron-specific age and contraindications' not in data
          assert 'name:"Atropine Sulfate"' in data
          assert 'JSON.stringify(item,null,2)' not in admin
          assert 'amount ÷ volume' in admin
          print('Clinical/Admin static assertions passed')
          PY
      - name: Build application
        run: npm run build
      - name: Commit validated audit fixes
        shell: bash
        run: |
          git config user.name "EMSCodeSim"
