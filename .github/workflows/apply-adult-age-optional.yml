name: Apply adult age optional
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[adult-age-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/make-adult-age-optional.py
      - run: npm ci
      - run: npm run build
      - name: Audit adult age optional
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/MedicationEngine.tsx').read_text()
          assert 'ageRequired=ageChangesDose&&path?.patient!=="adult"' in s
          assert 'effectiveAgeYears=age!==""?ageYears:path?.patient==="adult"?40:ageYears' in s
          assert 'dose:ageRequired&&age===""?"Age required"' in s
          assert '(!ageRequired||age!=="")' in s
          print('Adult pathways do not require age; known age remains available to age-specific rules')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MedicationEngine.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Do not require age for adult pathways [adult-age-generated]"
          git push
