name: Apply gravity drip UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[gravity-drip-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/apply-gravity-drip-ui.py
      - run: npm ci
      - run: npm run build
      - name: Audit gravity drip calculator
        run: |
          python - <<'PY'
          from pathlib import Path
          e=Path('src/MedicationEngine.tsx').read_text()
          c=Path('src/GravityDripCalculator.tsx').read_text()
          assert 'GravityDripCalculator' in e
          assert 'infusionLike=!!path&&' in e
          assert '[10,15,20,60]' in c
          assert 'drops/min' in c
          assert 'Final prepared volume' in c
          print('Shared infusion gravity calculator verified')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MedicationEngine.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add gravity drip rates to infusion medications [gravity-drip-generated]"
          git push
