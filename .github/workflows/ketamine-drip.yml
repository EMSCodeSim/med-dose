name: Apply Ketamine drip pathway
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[ketamine-drip-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/ketamine-drip.py
      - run: npm ci
      - run: npm run build
      - name: Audit Ketamine drip pathway
        run: |
          python - <<'PY'
          from pathlib import Path
          f=Path('src/fieldMedicationDefinitions.ts').read_text()
          a=Path('src/AdminMedicationManager.tsx').read_text()
          assert 'route:"IV/IO drip"' in f
          assert 'IV/IO drip/infusion: mix in 50–100 mL NS and administer over 5–10 minutes' in f
          assert 'routes:["IV/IO drip"]' in a
          assert 'label:"200 mg / 20 mL"' in a
          print('Ketamine drip pathway verified')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fieldMedicationDefinitions.ts src/AdminMedicationManager.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Treat Ketamine analgesia as IV/IO drip [ketamine-drip-generated]"
          git push
