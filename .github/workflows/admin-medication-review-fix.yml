name: Fix medication admin review migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-medication-review-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Recreate migration output and fix syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/admin-medication-review-migration.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=workflow.index(marker)+len(marker)
          end=workflow.index("\n          PY",start)
          script=workflow[start:end]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script,'admin-migration','exec'))
          path=Path('src/AdminMedicationManager.tsx')
          text=path.read_text(encoding='utf-8')
          text=text.replace('if(record.draft)return count?`CHANGES PENDING • ${count}/3":"CHANGES PENDING"`;','if(record.draft)return count?`CHANGES PENDING • ${count}/3`:"CHANGES PENDING";')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Commit medication admin system
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/dmpMedicationData.ts src/AdminMedicationManager.tsx src/adminMedicationStore.ts src/adminMedicationManager.css
          git commit -m "Add six-month medication admin review workflow"
          git push origin HEAD:main
