name: Simplify Adult Pediatric sections
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[age-sections-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/simplify-age-sections.py
      - run: npm ci
      - run: npm run build
      - name: Audit simplified age sections
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/MedicationEngine.tsx').read_text()
          c=Path('src/genericMedication.css').read_text()
          assert 'patient-path-badge' not in s[s.index('step==="indication"'):s.index('step==="route"')]
          assert 'Simplified age sections: one clear heading' in c
          assert '.indication-age-group .patient-path-badge{display:none !important}' in c
          print('Adult/Pediatric indication layout verified')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MedicationEngine.tsx src/genericMedication.css
          git diff --cached --quiet && exit 0
          git commit -m "Simplify Adult and Pediatric indication sections [age-sections-generated]"
          git push
