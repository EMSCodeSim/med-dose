name: Fix duplicate Give Now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-duplicate-give-now.yml

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Remove duplicate administration actions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f"Missing patch anchor: {label}")
              return text.replace(old,new,1)

          p=Path('src/FentanylDoseDashboard.tsx')
          t=p.read_text(encoding='utf-8')
          t=replace_once(t,
            '  giveDisabled:boolean;\n  onGive:()=>void;\n',
            '  giveDisabled:boolean;\n  showGiveAction?:boolean;\n  onGive:()=>void;\n',
            'dashboard prop')
          t=replace_once(t,
            'export default function FentanylDoseDashboard({medication,route,ready,previewReady,dose,volume,doseDetail,secondaryDetail,math,mathDetails=[],showMath,setShowMath,syringeVolume,instructions=[],correction,giveLabel="GIVE NOW",giveText,giveDetail,giveDisabled,onGive,repeat,recorded}:Props){',
            'export default function FentanylDoseDashboard({medication,route,ready,previewReady,dose,volume,doseDetail,secondaryDetail,math,mathDetails=[],showMath,setShowMath,syringeVolume,instructions=[],correction,giveLabel="GIVE NOW",giveText,giveDetail,giveDisabled,showGiveAction=true,onGive,repeat,recorded}:Props){',
            'dashboard destructure')
          t=replace_once(t,
            '    <button className={recorded?"dashboard-give-now repeat":"dashboard-give-now"} disabled={giveDisabled} onClick={onGive}><small>{giveLabel}</small><strong>{giveText}</strong>{giveDetail&&<span>{giveDetail}</span>}</button>',
            '    {showGiveAction&&<button className="dashboard-give-now" disabled={giveDisabled} onClick={onGive}><small>{giveLabel}</small><strong>{giveText}</strong>{giveDetail&&<span>{giveDetail}</span>}</button>}',
            'dashboard give button')
          p.write_text(t,encoding='utf-8')

          p=Path('src/DoseTracker.tsx')
          t=p.read_text(encoding='utf-8')
          t=replace_once(t,
            'export default function DoseTracker({entries,unit,total,totalVolume,maxTotal,repeatsLeft,repeatMinutes,secondsLeft,nextDose,initialDose,concentration,drug,reason,route,intranasal,record,openEndedRepeats=false,volumeEnabled=true}:{entries:Entry[];unit:string;total:number;totalVolume:number;maxTotal:number;repeatsLeft:number;repeatMinutes:number;secondsLeft:number;nextDose:number;initialDose?:number;concentration:number;drug:string;reason:string;route:string;intranasal:boolean;record:(dose:number)=>void;openEndedRepeats?:boolean;volumeEnabled?:boolean}) {',
            'export default function DoseTracker({entries,unit,total,totalVolume,maxTotal,repeatsLeft,repeatMinutes,secondsLeft,nextDose,initialDose,concentration,drug,reason,route,intranasal,record,openEndedRepeats=false,volumeEnabled=true,hideInitialAction=false}:{entries:Entry[];unit:string;total:number;totalVolume:number;maxTotal:number;repeatsLeft:number;repeatMinutes:number;secondsLeft:number;nextDose:number;initialDose?:number;concentration:number;drug:string;reason:string;route:string;intranasal:boolean;record:(dose:number)=>void;openEndedRepeats?:boolean;volumeEnabled?:boolean;hideInitialAction?:boolean}) {',
            'tracker prop')
          t=replace_once(t,
            '  const initialRecordButton=<button className="initial-record-dose"',
            '  if(!started&&hideInitialAction)return null;\n  const initialRecordButton=<button className="initial-record-dose"',
            'tracker initial action guard')
          p.write_text(t,encoding='utf-8')

          p=Path('src/MedicationEngine.tsx')
          t=p.read_text(encoding='utf-8')
          t=replace_once(t,
            '          giveLabel={administrations.length?"GIVE NEXT DOSE NOW":"GIVE NOW"}\n          giveText=',
            '          giveLabel="GIVE NOW"\n          showGiveAction={!administrations.length&&!isDopamine&&!linkedDose&&result.numeric}\n          giveText=',
            'engine dashboard action ownership')
          t=replace_once(t,
            'record={recordAmount} openEndedRepeats={!!path.openEndedRepeats} volumeEnabled={needsConcentration||result.unit==="mL"}/>',
            'record={recordAmount} openEndedRepeats={!!path.openEndedRepeats} volumeEnabled={needsConcentration||result.unit==="mL"} hideInitialAction/>',
            'engine tracker initial action')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "EMSCodeSim"
          git config user.email "davidagallaher@hotmail.com"
          git add src/FentanylDoseDashboard.tsx src/DoseTracker.tsx src/MedicationEngine.tsx
          git commit -m "Keep one Give Now action per medication"
          git push origin HEAD:main
