name: Apply smart medication flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[smart-flow-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/simplify-medication-flow.py
      - run: npm ci
      - run: npm run build
      - name: Audit smart flow
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/MedicationEngine.tsx').read_text()
          assert 'returnToResult' in s
          assert 'nextRoutes.length===1' in s
          assert 'nextNeedsSafety' in s
          assert 'agentPaths.length===1' in s
          assert 'setReturnToResult(true);setStep("route")' in s
          assert 'setReturnToResult(true);setStep("indication")' in s
          assert 'Continue to route' not in s
          print('Smart-skip and edit-return flow verified')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MedicationEngine.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Simplify medication flow with smart skips [smart-flow-generated]"
          git push
