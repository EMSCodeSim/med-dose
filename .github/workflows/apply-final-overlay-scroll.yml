name: Apply final overlay scroll fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[final-overlay-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/fix-final-overlay-scroll.py
      - run: npm ci
      - run: npm run build
      - name: Audit final overlay scrolling
        run: |
          python - <<'PY'
          from pathlib import Path
          e=Path('src/MedicationEngine.tsx').read_text()
          c=Path('src/medicationBuilderShell.css').read_text()
          assert 'position:fixed !important' in c
          assert 'height:100dvh !important' in c
          assert 'overflow-y:auto !important' in c
          assert 'body:has(#active-medication-screen-top.calculation-complete-flow)' in c
          assert 'shell.scrollTo({top:0,left:0,behavior:"auto"})' in e
          print('Dedicated Final Dose overlay and top scrolling verified')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MedicationEngine.tsx src/medicationBuilderShell.css
          git diff --cached --quiet && exit 0
          git commit -m "Make Final Dose independently scrollable [final-overlay-generated]"
          git push
