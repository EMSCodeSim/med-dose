name: Apply Fentanyl field flow
on:
  push:
    branches: [refactor/unified-medication-builder]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[field-flow-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-medication-builder
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply field-flow migration
        run: python scripts/apply-fentanyl-field-flow.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DmpMedicationCalculator.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Apply Fentanyl field flow [field-flow-generated]"
          git push
