name: Streamline field medication flow
on:
  push:
    branches: [refactor/unified-medication-builder]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[field-flow-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-medication-builder
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/streamline-field-med-flow.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DmpMedicationCalculator.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Streamline field medication flow [field-flow-generated]"
          git push
