name: Apply operational flow cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[operational-flow-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/apply-operational-flow-cleanup.py
      - run: python scripts/remove-legacy-repeat-block.py
      - run: npm ci
      - run: npm run build
      - name: Audit operational flow cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          e=Path('src/MedicationEngine.tsx').read_text()
          d=Path('src/FentanylDoseDashboard.tsx').read_text()
          g=Path('src/GravityDripCalculator.tsx').read_text()
          c=Path('src/genericMedication.css').read_text()
          assert 'safety-med-summary' in e
          assert 'DMP DOSE' not in e[e.find('step==="safety"'):e.find('step==="result"')]
          assert 'repeatAction=' in e
          assert 'infusionContent=' in e
          assert 'false&&result.numeric' not in e
          assert 'DOSE {recorded.count} GIVEN' in d
          assert 'dashboard-next-dose-action' in d
          assert 'primary?:boolean' in g
          assert 'gravity-primary-lines' in g
          assert 'Unified post-medication flow: one frame' in c
          print('Operational post-medication flow verified')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MedicationEngine.tsx src/FentanylDoseDashboard.tsx src/GravityDripCalculator.tsx src/genericMedication.css src/gravityDripCalculator.css
          git diff --cached --quiet && exit 0
          git commit -m "Standardize post-medication operational flow [operational-flow-generated]"
          git push
