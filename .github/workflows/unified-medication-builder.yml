name: Unified medication builder refactor

on:
  push:
    branches:
      - refactor/unified-medication-builder
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/unified-medication-builder
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply structural refactor
        run: python scripts/refactor-unified-medication-builder.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "EMSCodeSim"
          git config user.email "actions@users.noreply.github.com"
          git add src/FentanylBuilder.tsx src/VersedBuilder.tsx src/KetamineBuilder.tsx src/DmpMedicationCalculator.tsx
          git commit -m "Route medication calculators through shared builder shell"
          git push origin HEAD:refactor/unified-medication-builder
