name: Apply clean final medication card
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[clean-final-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/clean-final-medication-card.py
      - run: npm ci
      - run: npm run build
      - name: Audit clean final medication card
        run: |
          python - <<'PY'
          from pathlib import Path
          d=Path('src/FentanylDoseDashboard.tsx').read_text()
          e=Path('src/MedicationEngine.tsx').read_text()
          c=Path('src/genericMedication.css').read_text()
          assert 'administration-area-heading' not in d
          assert 'FINAL DOSE' in d
          assert 'final-edit-grid' in e
          assert 'final-action-row' in e
          assert 'final-math-line' in e
          assert 'final-all-details' in e
          assert 'CHANGE AMOUNT' in e
          assert 'MORE DETAILS' in e
          assert 'DoseSyringe' in e
          assert 'Clean final medication card' in c
          print('Clean final screen hierarchy verified')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FentanylDoseDashboard.tsx src/MedicationEngine.tsx src/genericMedication.css
          git diff --cached --quiet && exit 0
          git commit -m "Clean final medication card [clean-final-generated]"
          git push
