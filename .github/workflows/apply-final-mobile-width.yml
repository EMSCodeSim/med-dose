name: Apply final mobile width fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[final-mobile-width-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/fix-final-mobile-width.py
      - run: npm ci
      - run: npm run build
      - name: Audit mobile final width
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('src/medicationBuilderShell.css').read_text()
          assert 'Final Dose mobile width reset' in c
          assert 'width:100% !important' in c
          assert 'transform:none !important' in c
          assert 'grid-column:1 / -1 !important' in c
          assert 'overflow-x:hidden !important' in c
          print('Final Dose mobile width reset verified')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/medicationBuilderShell.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix Final Dose mobile width [final-mobile-width-generated]"
          git push
