name: Apply final screen simplification
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[final-screen-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/simplify-final-screen.py
      - run: npm ci
      - run: npm run build
      - name: Audit simplified final screen
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/MedicationEngine.tsx').read_text()
          assert 'Tap a selection to edit it' in s
          assert 'Show full medication cross-check' not in s
          assert 'Documentation reminders' not in s
          assert 'FINAL CALCULATED RESULT' not in s
          assert 'PROTOCOL DOSE' not in s
          print('Final screen duplicate panels removed and compact cross-check verified')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MedicationEngine.tsx src/genericMedication.css
          git diff --cached --quiet && exit 0
          git commit -m "Simplify final medication screen [final-screen-generated]"
          git push
