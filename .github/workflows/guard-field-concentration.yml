name: Guard field concentration
on:
  push:
    branches: [refactor/unified-medication-builder]
permissions:
  contents: write
jobs:
  guard:
    if: ${{ !contains(github.event.head_commit.message, '[guard-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-medication-builder
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/guard-missing-field-concentration.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DmpMedicationCalculator.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Guard missing field concentration [guard-generated]"
          git push
