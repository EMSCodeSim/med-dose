name: Apply one-click review update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[one-click-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/streamline-one-click-review.py
      - run: npm ci
      - run: npm run build
      - name: Audit one-click flow
        run: |
          grep -q 'onClick={()=>{choosePath(x);setStep("route")}}' src/MedicationEngine.tsx
          grep -q 'onClick={()=>{setRoute(x);setStep(needsPatientInfo?"patient":"safety")}}' src/MedicationEngine.tsx
          ! grep -q 'Continue to route' src/MedicationEngine.tsx
          ! grep -q 'Continue to final dose' src/MedicationEngine.tsx
          grep -q 'FINAL CROSS-CHECK' src/MedicationEngine.tsx
          grep -q 'onClick={()=>setStep("route")}' src/MedicationEngine.tsx
          echo 'One-click selections and visible editable final cross-check verified'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MedicationEngine.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Make quick picks one-click and final review editable [one-click-generated]"
          git push
