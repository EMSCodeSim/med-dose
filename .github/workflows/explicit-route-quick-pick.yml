name: Explicit route quick pick
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[route-quick-pick-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/make-route-explicit.py
      - run: npm ci
      - run: npm run build
      - name: Audit explicit route quick pick
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/MedicationEngine.tsx').read_text()
          assert 'selectedRoute=route,' in s
          assert 'Route is always an explicit quick-pick step' in s
          assert 'setPath(next);setRoute("")' in s
          assert 'ROUTE QUICK PICK' in s
          assert 'detail:selectedRoute?"Route selected":"Select route"' in s
          print('Explicit route quick-pick flow verified')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MedicationEngine.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Make route an explicit quick-pick step [route-quick-pick-generated]"
          git push
