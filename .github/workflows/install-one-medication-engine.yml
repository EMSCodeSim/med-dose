name: Install one medication engine
on:
  push:
    branches: [refactor/unified-medication-builder]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[one-engine-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-medication-builder
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/install-one-medication-engine.py
      - run: npm ci
      - run: npm run build
      - name: Audit released medication definitions
        run: |
          npx esbuild src/fieldMedicationDefinitions.ts --bundle --platform=node --format=cjs --outfile=/tmp/field-defs.cjs
          node - <<'NODE'
          const defs=require('/tmp/field-defs.cjs');
          const ids=['adenosine','amiodarone','ondansetron','haloperidol','atropine','midazolam','fentanyl','calcium','dextrose','diphenhydramine','epinephrine','magnesium','methylprednisolone','naloxone','sodium-bicarbonate','ketamine'];
          const missing=ids.filter(id=>!defs.fieldMedicationDefinition(id));
          if(missing.length) throw new Error('released definitions missing: '+missing.join(', '));
          defs.assertReleasedMedicationDefinitions();
          console.log('All 16 released medications resolve through the one-engine definition layer');
          NODE
      - name: Audit runtime engine imports
        run: |
          grep -q 'import Home from "./UnifiedApp"' src/main.tsx
          grep -q 'from "./MedicationEngine"' src/UnifiedApp.tsx
          ! grep -q 'FentanylBuilder' src/UnifiedApp.tsx
          ! grep -q 'VersedBuilder' src/UnifiedApp.tsx
          ! grep -q 'KetamineBuilder' src/UnifiedApp.tsx
          ! grep -q 'DmpMedicationCalculator' src/UnifiedApp.tsx
          echo 'Runtime routes all released medications through MedicationEngine only'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MedicationEngine.tsx src/FieldToolbar.tsx src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Install single medication engine runtime [one-engine-generated]"
          git push
