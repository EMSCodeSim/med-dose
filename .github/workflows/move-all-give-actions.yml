name: Move all give actions out of details
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[give-actions-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/move-all-give-actions-out-of-details.py
      - run: npm ci
      - run: npm run build
      - name: Audit visible administration actions
        run: |
          python - <<'PY'
          from pathlib import Path
          e=Path('src/MedicationEngine.tsx').read_text()
          details=e[e.find('<details className="final-all-details"'):]
          assert 'final-primary-administration-actions' in e
          assert 'START INFUSION' not in details
          assert 'LINKED SECOND DOSE' not in details
          assert '<small>TREATMENT</small>' not in details
          print('All medication administration actions are outside More Details')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MedicationEngine.tsx src/genericMedication.css
          git diff --cached --quiet && exit 0
          git commit -m "Keep all give actions visible above details [give-actions-generated]"
          git push
