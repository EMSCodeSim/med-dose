name: Apply final cross-check placement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[crosscheck-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/move-final-crosscheck-top.py
      - run: npm ci
      - run: npm run build
      - name: Audit cross-check placement and edit affordance
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/MedicationEngine.tsx').read_text()
          result=s.index('{step==="result"&&path&&result&&<>')
          cross=s.index('FINAL CROSS-CHECK',result)
          dash=s.index('<FentanylDoseDashboard',result)
          assert cross < dash, 'cross-check is not above dashboard'
          for label in ['EDIT INDICATION →','EDIT ROUTE →','EDIT SAFETY →']:
              assert label in s, label+' missing'
          c=Path('src/genericMedication.css').read_text()
          assert '.final-selection-review {' in c
          print('final cross-check is first and edit buttons are explicit')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MedicationEngine.tsx src/genericMedication.css
          git diff --cached --quiet && exit 0
          git commit -m "Move final cross-check above dose and clarify edit buttons [crosscheck-generated]"
          git push
