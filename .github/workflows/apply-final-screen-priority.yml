name: Apply final screen priority
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[final-priority-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/final-screen-priority-pass.py
      - run: npm ci
      - run: npm run build
      - name: Audit final screen priorities
        run: |
          python - <<'PY'
          from pathlib import Path
          d=Path('src/FentanylDoseDashboard.tsx').read_text()
          e=Path('src/MedicationEngine.tsx').read_text()
          c=Path('src/genericMedication.css').read_text()
          assert 'dose-math-always-open' in d
          assert 'dashboard-more-details' in d
          assert 'CHANGE AMOUNT TO GIVE' in e
          assert 'actualDose>0?actualDose:result.dose' in e
          assert 'Final screen priority: selections, dose, change dose, and math stay large/open.' in c
          print('Final screen priority layout verified')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FentanylDoseDashboard.tsx src/MedicationEngine.tsx src/genericMedication.css
          git diff --cached --quiet && exit 0
          git commit -m "Prioritize final dose, change dose, and math [final-priority-generated]"
          git push
