name: Validate structured medication admin

on:
  push:
    branches: [admin-structured-editor]

permissions:
  contents: write

jobs:
  build-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: admin-structured-editor
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Wire editable catalog into field app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/App.tsx')
          text=path.read_text(encoding='utf-8')
          import_line='import {mergeMedicationCatalog,medicationCatalogRetired,medicationCatalogVisible} from "./medicationCatalogStore";\n'
          anchor='import AdminMedicationManager from "./AdminMedicationManager";\n'
          if import_line not in text:
              if anchor not in text: raise SystemExit('Admin import anchor missing')
              text=text.replace(anchor,anchor+import_line,1)
          if 'const bundledMeds:MedicationCatalogItem[] = [' not in text:
              text=text.replace('const meds:MedicationCatalogItem[] = [','const bundledMeds:MedicationCatalogItem[] = [',1)
          catalog_insert='];\nconst meds:MedicationCatalogItem[]=mergeMedicationCatalog(bundledMeds) as MedicationCatalogItem[];\nconst MEDICATION_REVIEWS_KEY'
          if 'mergeMedicationCatalog(bundledMeds)' not in text:
              marker='];\nconst MEDICATION_REVIEWS_KEY'
              if marker not in text: raise SystemExit('Medication catalog end marker missing')
              text=text.replace(marker,catalog_insert,1)
          old='''const TESTING_VISIBLE_MEDICATION_IDS=["midazolam","fentanyl","ketamine"];
          const PILOT_RELEASED_MEDICATION_IDS=["midazolam","fentanyl","ketamine"];
          function medicationReleased(reviews:MedicationReviews,id:string){return PILOT_RELEASED_MEDICATION_IDS.includes(id)||medicationReviewCount(reviews,id)===3}'''
          new='''const DEFAULT_TESTING_VISIBLE_MEDICATION_IDS=["midazolam","fentanyl","ketamine"];
          const TESTING_VISIBLE_MEDICATION_IDS=meds.filter((med)=>!medicationCatalogRetired(med.id)&&medicationCatalogVisible(med.id,DEFAULT_TESTING_VISIBLE_MEDICATION_IDS.includes(med.id))).map((med)=>med.id);
          const PILOT_RELEASED_MEDICATION_IDS=DEFAULT_TESTING_VISIBLE_MEDICATION_IDS;
          function medicationPreviouslyApproved(id:string){
            if(typeof window==="undefined")return false;
            try{const state=JSON.parse(window.localStorage.getItem("metro-med-dose-admin-medication-state-v1")||"{}");return Boolean(state?.[id]?.lastCompletedAt)}catch{return false}
          }
          function medicationReleased(reviews:MedicationReviews,id:string){return PILOT_RELEASED_MEDICATION_IDS.includes(id)||medicationPreviouslyApproved(id)||medicationReviewCount(reviews,id)===3}'''
          if 'const DEFAULT_TESTING_VISIBLE_MEDICATION_IDS=' not in text:
              if old not in text: raise SystemExit('Visibility/release block missing')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Commit validated App integration
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "EMSCodeSim"
          git config user.email "davidagallaher@hotmail.com"
          git add src/App.tsx
          git commit -m "Wire structured Admin catalog into field medication list"
          git push origin HEAD:admin-structured-editor
